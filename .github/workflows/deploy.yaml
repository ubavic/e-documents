name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:      
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Prepare SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/key
          sudo chmod 600 ~/.ssh/key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H new.ubavic.rs >> ~/.ssh/known_hosts
      
      - name: Publish site
        run: |
          rm -Rf .github .gitignore .git
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/key -r * ${{ secrets.USER }}@new.ubavic.rs:/var/www/e-documents.ubavic.rs/